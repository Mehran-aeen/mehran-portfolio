
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090611">

<title>A Heart Made of Love | Mehran</title>

<!-- Special fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #ff3e83;
  --purple: #bd78ff;
  --cyan: #8be9ff;
  --bg: #090611;
  --text: #fff4f8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  background:
    radial-gradient(ellipse at 50% 42%, #35132f 0%, #150b1c 43%, var(--bg) 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 15% 20%, #ffffff99 99%, transparent),
    radial-gradient(2px 2px at 80% 30%, #ff8bb999 99%, transparent),
    radial-gradient(1px 1px at 65% 75%, #ffffff99 99%, transparent),
    radial-gradient(2px 2px at 25% 85%, #c084fc99 99%, transparent);
  background-size: 230px 220px;
  animation: stars 12s linear infinite;
}

.page {
  position: relative;
  width: min(100%, 900px);
  min-height: 100vh;
  margin: auto;
  padding: 24px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Animated creator profile */

.profile {
  z-index: 2;
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 17px 9px 9px;
  border: 1px solid #ff7aa966;
  border-radius: 60px;
  background: #ffffff0c;
  backdrop-filter: blur(14px);
  color: white;
  text-decoration: none;
  box-shadow: 0 8px 35px #0005;
  animation: profileIntro 1s ease both, profileGlow 3s ease-in-out 1s infinite;
  transition: transform .3s ease;
}

.profile:hover {
  transform: translateY(-4px) scale(1.025);
}

.avatar-ring {
  width: 55px;
  height: 55px;
  padding: 2px;
  border-radius: 50%;
  background: conic-gradient(
    #ff174f, #ffb5d0, #b66aff, #8be9ff, #ff174f
  );
  animation: rotateRing 5s linear infinite;
}

.avatar {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border: 2px solid #180c1b;
  border-radius: 50%;
}

.identity {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.name {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #ffffff, #ff8dbb, #d4a5ff, #ffffff);
  background-size: 250% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: textShine 4s linear infinite;
}

.handle {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: var(--cyan);
  letter-spacing: .4px;
  text-shadow: 0 0 10px #8be9ff66;
}

.arrow {
  color: #ffb3ce;
  font-size: 20px;
  transition: transform .3s ease;
}

.profile:hover .arrow {
  transform: translate(3px, -3px);
}

/* Animated heading */

.intro {
  z-index: 1;
  text-align: center;
  margin-top: 30px;
  animation: fadeUp 1s ease both;
}

.eyebrow {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #ff9bc0;
  text-shadow: 0 0 14px #ff3e8366;
  animation: eyebrowGlow 3s ease-in-out infinite;
}

h1 {
  margin: 14px 0 10px;
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 6vw, 48px);
  font-weight: 800;
  line-height: 1.2;
  background: linear-gradient(
    110deg,
    #ffffff 5%,
    #ff83b4 30%,
    #d4a1ff 60%,
    #8be9ff 80%,
    #ffffff 100%
  );
  background-size: 250% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 15px #ff4d9725);
  animation: textShine 6s linear infinite, titleFloat 4s ease-in-out infinite;
}

.subtitle {
  margin: 0;
  font-size: 13px;
  letter-spacing: .4px;
  color: #e5cde9;
  animation: fadeUp 1.4s ease both;
}

.subtitle .heart-icon {
  display: inline-block;
  color: #ff4d88;
  animation: miniBeat 1.2s ease-in-out infinite;
  text-shadow: 0 0 12px #ff4d88;
}

/* Heart stage */

.heart-stage {
  position: relative;
  width: min(100%, 680px);
  height: clamp(350px, 58vh, 530px);
  margin-top: 5px;
  display: grid;
  place-items: center;
}

.heart-stage::before {
  content: "";
  position: absolute;
  width: 60%;
  height: 45%;
  border-radius: 50%;
  background: #ff1d6425;
  filter: blur(45px);
  animation: pulse 3s ease-in-out infinite;
}

#heart {
  position: relative;
  width: 100%;
  height: 100%;
}

.love {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%) scale(.2);
  opacity: 0;
  white-space: nowrap;
  font-size: clamp(6px, 1.15vw, 10px);
  font-weight: 800;
  letter-spacing: .02em;
  color: hsl(var(--hue), 100%, var(--light));
  text-shadow: 0 0 7px #ff397b80, 0 0 15px #ff174f35;
  animation: appear .55s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--delay);
}

.footer {
  margin-top: auto;
  padding: 18px 0 4px;
  font-family: 'Orbitron', sans-serif;
  color: #b9a3c4;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  animation: fadeUp 2s ease both;
}

.footer span {
  color: var(--pink);
  text-shadow: 0 0 12px var(--pink);
  animation: miniBeat 1.2s ease-in-out infinite;
  display: inline-block;
}

/* Animations */

@keyframes profileIntro {
  from { opacity: 0; transform: translateY(-25px) scale(.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes profileGlow {
  0%, 100% { box-shadow: 0 8px 35px #0005, 0 0 8px #ff3e8310; }
  50% { box-shadow: 0 8px 35px #0005, 0 0 25px #ff3e8350; }
}

@keyframes rotateRing {
  to { filter: hue-rotate(360deg); }
}

@keyframes textShine {
  to { background-position: 250% center; }
}

@keyframes titleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes eyebrowGlow {
  0%, 100% { opacity: .7; letter-spacing: 4px; }
  50% { opacity: 1; letter-spacing: 4.8px; }
}

@keyframes miniBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.25); }
  30% { transform: scale(1); }
  45% { transform: scale(1.15); }
}

@keyframes stars {
  from { transform: translateY(0); }
  to { transform: translateY(-40px); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes appear {
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes pulse {
  0%, 100% { opacity: .5; transform: scale(.9); }
  50% { opacity: 1; transform: scale(1.1); }
}

@media (max-width: 480px) {
  .page { padding: 18px 8px; }
  .avatar-ring { width: 46px; height: 46px; }
  .profile { gap: 9px; padding: 8px 12px 8px 8px; }
  .name { font-size: 12px; }
  .handle { font-size: 9px; }
  .intro { margin-top: 25px; }
  .eyebrow { font-size: 8px; letter-spacing: 2.5px; }
  h1 { font-size: clamp(27px, 7vw, 36px); }
  .subtitle { font-size: 11px; }
  .heart-stage {
    height: clamp(330px, 53vh, 430px);
    margin-top: 12px;
  }
  .love { font-size: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <a class="profile"
     href="https://github.com/Mehran-aeen"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Visit Mehran's GitHub profile">

    <span class="avatar-ring">
      <img class="avatar"
           src="https://avatars.githubusercontent.com/u/289211534?v=4"
           alt="Mehran's profile picture">
    </span>

    <span class="identity">
      <span class="name">MEHRAN</span>
      <span class="handle">@Mehran-aeen · GitHub</span>
    </span>

    <span class="arrow">↗</span>
  </a>

  <header class="intro">
    <div class="eyebrow">✦ A LITTLE THING MADE WITH LOVE ✦</div>

    <h1>A Heart Made of Love</h1>

    <p class="subtitle">
      Every little word, placed one by one.
      <span class="heart-icon">♥</span>
    </p>
  </header>

  <section class="heart-stage"
           aria-label="Heart made from I LOVE YOU words">
    <div id="heart"></div>
  </section>

  <footer class="footer">
    DESIGNED WITH <span>♥</span> BY MEHRAN
  </footer>

</main>

<script>
const heart = document.getElementById("heart");
const mobile = window.matchMedia("(max-width: 480px)").matches;

// Create a regular heart shape from individual phrases.
const stepX = mobile ? 0.105 : 0.085;
const stepY = mobile ? 0.105 : 0.085;
const points = [];

for (let y = 1.18; y >= -1.12; y -= stepY) {
  for (let x = -1.28; x <= 1.28; x += stepX) {
    const equation =
      Math.pow(x * x + y * y - 1, 3) -
      x * x * Math.pow(y, 3);

    if (equation <= 0) {
      points.push({ x, y });
    }
  }
}

points.forEach((point, index) => {
  const word = document.createElement("span");

  word.className = "love";
  word.textContent = "I LOVE YOU";

  word.style.setProperty(
    "--x",
    (50 + point.x * 35.5) + "%"
  );

  word.style.setProperty(
    "--y",
    (48 - point.y * 35.5) + "%"
  );

  word.style.setProperty(
    "--hue",
    337 + (index % 13) * 1.6
  );

  word.style.setProperty(
    "--light",
    (62 + (index % 4) * 5) + "%"
  );

  word.style.setProperty(
    "--delay",
    Math.min(index * 0.006, 2.4) + "s"
  );

  heart.appendChild(word);
});
</script>
</body>
</html>
