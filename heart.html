
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle, #300015, #080008 75%);
    font-family: Arial, sans-serif;
}

#heart {
    width: 100%;
    max-width: 700px;
    text-align: center;
    line-height: 1.05;
    font-size: clamp(9px, 1.6vw, 14px);
    font-weight: bold;
    color: #ff1744;
    text-shadow: 0 0 8px #ff1744, 0 0 20px #ff1744;
    white-space: pre;
    animation: pulse 1.5s infinite ease-in-out;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(0.97);
        filter: brightness(0.9);
    }
    50% {
        transform: scale(1.03);
        filter: brightness(1.4);
    }
}

@media (max-width: 600px) {
    #heart {
        font-size: 7px;
    }
}
</style>
</head>

<body>

<pre id="heart"></pre>

<script>
const heart = document.getElementById("heart");

const size = 100;
let result = "";

for (let y = 1.5; y > -1.5; y -= 0.12) {
    for (let x = -1.5; x < 1.5; x += 0.045) {
        const a = x * x + y * y - 1;
        const inside = a * a * a - x * x * y * y * y <= 0;

        if (inside) {
            result += "I LOVE YOU ";
        } else {
            result += " ";
        }
    }
    result += "\n";
}

heart.textContent = result;
</script>

</body>
</html>
