<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;

    background: #080008;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

#heart {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* هر I LOVE YOU */

.love {
    position: absolute;

    color: #ff1744;

    font-size: clamp(9px, 1.7vw, 18px);

    font-weight: bold;

    white-space: nowrap;

    opacity: 0;

    transform: translate(-50%, -50%) scale(0);

    text-shadow:
        0 0 5px #ff1744,
        0 0 12px #ff1744;

    animation: appear .5s forwards;
}

@keyframes appear {

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

}

</style>
</head>

<body>

<div id="heart"></div>

<script>

const heart = document.getElementById("heart");

const total = 260;

/* ساخت نقاط قلب */

for (let i = 0; i < total; i++) {

    const t = (Math.PI * 2 * i) / total;

    /*
       فرمول قلب
    */

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const love = document.createElement("div");

    love.className = "love";

    love.innerText = "I LOVE YOU";

    /*
       تبدیل مختصات قلب
    */

    const centerX = 50;
    const centerY = 48;

    const scale = 2.8;

    love.style.left =
        (centerX + x * scale) + "%";

    love.style.top =
        (centerY - y * scale) + "%";

    /*
       ظاهر شدن دونه دونه
    */

    love.style.animationDelay =
        (i * 0.025) + "s";

    heart.appendChild(love);
}

</script>

</body>
</html>
